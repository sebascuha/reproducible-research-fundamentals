[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "reproducible-research-fundamentals"
version = "0.0.1"
description = "Hands-on workflow with World Bank files for Reproducible Research Fundamentals"
authors = [
  { name = "Sebastian Cuellar-Harker" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.11.0"

[tool.black]
line-length = 99
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
)/
'''

[tool.isort]
profile = "black"
known_first_party = ["reproducible-research-fundamentals"]
force_sort_within_sections = true


